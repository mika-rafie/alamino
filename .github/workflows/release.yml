name: release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Every target cross-compiles on one ubuntu runner (CGO is off). The macOS
  # binaries are not Developer ID signed or notarized: the Go linker ad-hoc
  # signs darwin/arm64, which is all Apple silicon needs to run it.
  build-and-upload:
    runs-on: ubuntu-latest
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build archive
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          COMMIT="$(git rev-parse --short=7 HEAD)"
          BIN="alamino"
          OUT="dist/${BIN}"
          if [ "$GOOS" = "windows" ]; then
            BIN="${BIN}.exe"
            OUT="dist/${BIN}"
          fi
          CGO_ENABLED=0 GOOS="$GOOS" GOARCH="$GOARCH" \
            go build -ldflags "-X github.com/mika-rafie/alamino/internal/buildinfo.Version=${TAG} -X github.com/mika-rafie/alamino/internal/buildinfo.Commit=${COMMIT} -X github.com/mika-rafie/alamino/internal/buildinfo.Date=${DATE}" \
            -o "$OUT" ./cmd/alamino
          if [ "$GOOS" = "windows" ]; then
            ARCHIVE="dist/alamino-${TAG}-${GOOS}-${GOARCH}.zip"
            (
              cd dist
              zip -q "$(basename "$ARCHIVE")" "$BIN"
            )
          else
            ARCHIVE="dist/alamino-${TAG}-${GOOS}-${GOARCH}.tar.gz"
            tar -C dist -czf "$ARCHIVE" "$BIN"
          fi
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "$TAG" "$ARCHIVE" --clobber

      - uses: actions/upload-artifact@v7
        with:
          name: archive-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ${{ env.ARCHIVE }}

  checksums:
    runs-on: ubuntu-latest
    needs:
      - release-please
      - build-and-upload
    if: |
      !cancelled() &&
      needs.release-please.result == 'success' &&
      needs.build-and-upload.result == 'success' &&
      needs.release-please.outputs.release_created == 'true'
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          set -euo pipefail
          (
            cd dist
            sha256sum alamino-* > ../checksums.txt
          )

      - name: Upload checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "$TAG" checksums.txt --clobber

  finalize:
    runs-on: ubuntu-latest
    needs:
      - release-please
      - build-and-upload
      - checksums
    if: |
      !cancelled() &&
      needs.release-please.result == 'success' &&
      needs.build-and-upload.result == 'success' &&
      needs.checksums.result == 'success' &&
      needs.release-please.outputs.release_created == 'true'
    steps:
      - name: Publish draft release as prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release edit "$TAG" --draft=false --prerelease=true

  # GitHub does not cascade GITHUB_TOKEN-triggered release events (anti-recursion),
  # so publish-channels' on: release never fires for release-please. Call it here
  # after finalize so channels.json refreshes once the prerelease and every
  # binary asset are live. EncodeChannelsManifest skips drafts, so this must not
  # run earlier. A failure fails this release run instead of leaving the channel
  # stale. publish-channels.yml keeps workflow_dispatch and on: release as
  # backstops for human/PAT publishes.
  publish-channels:
    needs:
      - finalize
    if: |
      !cancelled() &&
      needs.finalize.result == 'success'
    permissions:
      contents: write
    uses: ./.github/workflows/publish-channels.yml
